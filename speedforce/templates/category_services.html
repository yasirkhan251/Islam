<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{{ category.name }} Services</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Speedforce</a>
  </div>
</nav>
<div class="container">
    <h1 class="mb-4">{{ category.name }} Services</h1>
    <div class="row">
        {% for service in services %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                {% if service.image %}
                <img src="{{ service.image.url }}" class="card-img-top" alt="{{ service.name }}">
                {% endif %}
                <div class="card-body text-center">
                    <h5 class="card-title">{{ service.name }}</h5>
                    <p class="card-text">{{ service.description }}</p>
                    <p class="card-text fw-bold">${{ service.price }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <p>No services available in this category.</p>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
